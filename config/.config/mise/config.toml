[tools]
java = "corretto-23.0.2.7.1"
python = "3.11.16"
node = "24.18.0"
ruby = "4.0.1"
go = "1.27.1"
rust = "stable"
uv = "latest" # backend for the pypi: tools below

# CLI tools: prebuilt binaries (aqua) or packages on the runtimes above.
# `latest` resolves at install time; bump with `mise upgrade`.

# Go / API
golangci-lint = "latest"
goreleaser = "latest"
"aqua:gohugoio/hugo/hugo-extended" = "latest"
buf = "latest"
grpcurl = "latest"
"aqua:google/go-jsonnet" = "latest"

# Linters / formatters (used by nvim)
stylua = "latest"
shellcheck = "latest"
taplo = "latest"
yamllint = "latest"
markdownlint-cli2 = "latest"
prettier = "latest"
"npm:@fsouza/prettierd" = "latest"
"pypi:shandy-sqlfmt" = "latest"

# Kubernetes
k9s = "latest"
krew = "latest"
kubeconform = "latest"

# Cloud
awscli = "latest"
aws-sam-cli = "latest"
cookiecutter = "latest"

# Misc
lazygit = "latest"
lazydocker = "latest"
jq = "latest"
yq = "latest"
sops = "latest"
d2 = "latest"
glow = "latest"
"aqua:maaslalani/slides" = "latest"
acli = "latest"

[settings]
# mise ignores .nvmrc/.ruby-version/.python-version by default; repos that ship
# only those (and no .tool-versions) still need to resolve correctly.
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "java"]

[settings.ruby]
# mise's precompiled ruby is verified via GitHub artifact attestations, which
# need tuf-repo-cdn.sigstore.dev — blocked on the work network (TLS handshake
# refused). Compiling with ruby-build instead keeps SHA256 verification and
# matches what rbenv did here, rather than turning attestations off.
compile = true
