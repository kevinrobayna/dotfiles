# Global Gradle properties applied to all projects
# Project-level gradle.properties can override these

# Allocate 6GB to the Kotlin daemon
kotlin.daemon.jvmargs=-Xmx6g

# Allocate 6GB to the Gradle daemon
org.gradle.jvmargs=-Xmx6g

# Run the Gradle daemon on JDK 21. kotlin-lsp ignores JAVA_HOME and imports with its bundled
# JDK 25, which Gradle 8.x can't run on ("Unsupported class file major version 69").
org.gradle.java.home=/Users/kevin.robayna/.local/share/mise/installs/java/temurin-21

# Gradle auto-detects SDKMAN/asdf JDKs but not mise's, so toolchain requests (e.g.
# languageVersion=17) fail outside IntelliJ. Missing paths are skipped with a warning.
org.gradle.java.installations.paths=/Users/kevin.robayna/.local/share/mise/installs/java/17,/Users/kevin.robayna/.local/share/mise/installs/java/temurin-21,/Users/kevin.robayna/.local/share/mise/installs/java/corretto-23
